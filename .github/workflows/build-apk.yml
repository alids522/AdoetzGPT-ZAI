name: Build AdoetzGPT Zai APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Node.js dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: APP_BUILD_HASH=$(echo $GITHUB_SHA | cut -c1-7) npm run build

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Gradle wrapper
        working-directory: 'android'
        run: gradle wrapper --gradle-version 8.5

      - name: Build debug APK
        working-directory: 'android'
        run: ./gradlew assembleDebug

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs -name '*.apk' -type f | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          mkdir -p output
          cp "$APK_PATH" output/AdoetzGPT-zai-debug.apk
          echo "APK copied to output/AdoetzGPT-zai-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdoetzGPT-zai-debug
          path: output/AdoetzGPT-zai-debug.apk
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-zai
          path: |
            android/app/build/reports/
            android/build/reports/
          retention-days: 7
